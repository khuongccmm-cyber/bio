<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân</title>
  <style>
    /* Biến màu sắc (CSS Variables - tên đại diện cho mã màu để đổi giao diện nhanh) */
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #e6edf3;
      --text-sub: #8b949e;
      --accent: #2f81f7;
      --tag-bg: #21262d;
    }

    /* Giao diện nền sáng khi bấm nút chuyển đổi */
    body.light-mode {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --border-color: #d0d7de;
      --text-main: #1f2328;
      --text-sub: #656d76;
      --accent: #0969da;
      --tag-bg: #eaeef2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Khung lưới Bento chia các ô thông tin */
    .bento-container {
      max-width: 720px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .box:hover {
      border-color: var(--accent);
    }

    /* Ô trên cùng chiếm trọn 2 cột */
    .header-box {
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2f81f7, #8957e5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name-area h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .name-area p {
      color: var(--text-sub);
      font-size: 14px;
    }

    .theme-btn {
      background-color: var(--tag-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .box-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .info-list {
      list-style: none;
      line-height: 1.8;
      font-size: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background-color: var(--tag-bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--border-color);
    }

    /* Ô liên hệ dưới cùng chiếm trọn 2 cột */
    .contact-box {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn.secondary {
      background-color: var(--tag-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* Tự động xếp thành 1 cột dọc khi mở trên điện thoại */
    @media (max-width: 600px) {
      .bento-container {
        grid-template-columns: 1fr;
      }
      .header-box, .contact-box {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="bento-container">
    <!-- Ô 1: Ảnh đại diện & Tên -->
    <div class="box header-box">
      <div class="profile-left">
        <div class="avatar">
          <!-- Muốn dùng ảnh thật: bỏ dấu chú thích dòng dưới và đổi tên file avatar.jpg -->
           <img src="avatar.jpg" alt="Avatar">
          K
        </div>
        <div class="name-area">
          <h1>Hoài Khương</h1>
          <p>Bạc Liêu • Thích vọc công nghệ & tự do</p>
        </div>
      </div>
      <button class="theme-btn" onclick="doiMauNen()">🌓 Đổi Sáng / Tối</button>
    </div>

    <!-- Ô 2: Thông tin cơ bản -->
    <div class="box">
      <div class="box-title">📌 Thông tin</div>
      <ul class="info-list">
        <li><strong>Quê quán:</strong> Bạc Liêu</li>
        <li><strong>Công việc:</strong> Giao hàng & Tự do</li>
        <li><strong>Đang tìm hiểu:</strong> Code web, tự động hóa</li>
      </ul>
    </div>

    <!-- Ô 3: Sở thích (dạng thẻ tag) -->
    <div class="box">
      <div class="box-title">🎯 Sở thích</div>
      <div class="tags">
        <span class="tag">🎮 Liên Minh (ARAM)</span>
        <span class="tag">🖥️ Vọc phần cứng PC</span>
        <span class="tag">🎣 Câu cá</span>
        <span class="tag">📖 Đọc truyện</span>
        <span class="tag">🎧 Nhạc Remix</span>
      </div>
    </div>

    <!-- Ô 4: Liên hệ & Nút bấm -->
    <div class="box contact-box">
      <div>
        <div class="box-title" style="margin-bottom: 4px;">📬 Kết nối</div>
        <div id="trang-thai-copy" style="font-size: 14px; color: var(--text-sub);">
          SĐT / Zalo: <strong style="color: var(--text-main);">0944396154</strong>
        </div>
      </div>
      <div class="btn-group">
        <button class="action-btn" onclick="copySoDienThoai()">📋 Copy SĐT</button>
        <a class="action-btn secondary" href="https://www.facebook.com/canten.ko.501/" target="_blank">Facebook</a>
        <a class="action-btn secondary" href="https://www.tiktok.com/@mydmd1t4" target="_blank">TikTok</a>
      </div>
    </div>
  </div>

  <script>
    // Chức năng 1: Chuyển đổi giao diện Sáng / Tối
    function doiMauNen() {
      document.body.classList.toggle("light-mode");
    }

    // Chức năng 2: Bấm nút tự động copy số điện thoại vào bộ nhớ tạm
    function copySoDienThoai() {
      const sdt = "09xxxxxxxx"; // Sửa số thật của bạn ở đây
      navigator.clipboard.writeText(sdt);
      document.getElementById("trang-thai-copy").innerHTML = "✅ Đã chép số: <strong>" + sdt + "</strong>";
    }
  </script>

</body>
</html>
