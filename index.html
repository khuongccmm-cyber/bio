<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ Sơ Cá Nhân - Hoài Khương</title>
<style>
/* Biến màu sắc (CSS Variables - tên đại diện cho mã màu để đổi giao diện nhanh) */
:root {
  --bg-color: #090d16;
  --card-bg: rgba(15, 21, 34, 0.82);
  --border-color: rgba(56, 189, 248, 0.28);
  --text-main: #e6edf3;
  --text-sub: #94a3b8;
  --accent: #38bdf8;
  --accent-2: #a855f7;
  --neon-soft: 0 0 14px rgba(56, 189, 248, 0.18), 0 0 28px rgba(168, 85, 247, 0.08);
  --neon-hover: 0 0 18px rgba(56, 189, 248, 0.42), 0 0 36px rgba(168, 85, 247, 0.18);
  --spotlight: rgba(56, 189, 248, 0.16);
  --tag-bg: rgba(24, 34, 54, 0.9);
  --table-head: rgba(56, 189, 248, 0.14);
  --table-row-hover: rgba(56, 189, 248, 0.06);
}

/* Giao diện nền sáng khi bấm nút chuyển đổi */
body.light-mode {
  --bg-color: #f4f6f8;
  --card-bg: rgba(255, 255, 255, 0.88);
  --border-color: rgba(2, 132, 199, 0.22);
  --text-main: #1f2328;
  --text-sub: #57606a;
  --accent: #0284c7;
  --accent-2: #7e22ce;
  --neon-soft: 0 6px 18px rgba(15, 23, 42, 0.06);
  --neon-hover: 0 10px 24px rgba(2, 132, 199, 0.16);
  --spotlight: rgba(2, 132, 199, 0.1);
  --tag-bg: rgba(234, 238, 242, 0.94);
  --table-head: rgba(2, 132, 199, 0.1);
  --table-row-hover: rgba(2, 132, 199, 0.05);
}

/* Reset mặc định cho mọi phần tử */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  padding: 32px 15px 60px;
  min-height: 100vh;
  background-image: linear-gradient(rgba(9, 13, 22, 0.8), rgba(9, 13, 22, 0.82)), url("anh/0001.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: background-color 0.3s, color 0.3s;
}

body.light-mode {
  background-image: linear-gradient(rgba(244, 246, 248, 0.84), rgba(244, 246, 248, 0.84)), url("anh/0001.jpg");
}

/* Khung lưới Bento chia các ô thông tin */
.bento-container {
  max-width: 780px;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  align-content: start;
}

/* Kính mờ + viền neon + ánh sáng chạy theo chuột + trượt lên khi mở trang */
.box {
  position: relative;
  overflow: hidden;
  background-color: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 22px;
  box-shadow: var(--neon-soft);
  opacity: 0;
  transform: translateY(14px);
  animation: hienLenMuot 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

/* Lớp vệt sáng đi theo con trỏ chuột */
.box::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), var(--spotlight), transparent 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.box:hover::before {
  opacity: 1;
}

.box:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--neon-hover);
}

/* Trễ nhịp từng ô để xuất hiện lần lượt */
.bento-container .box:nth-child(1) { animation-delay: 0.04s; }
.bento-container .box:nth-child(2) { animation-delay: 0.1s; }
.bento-container .box:nth-child(3) { animation-delay: 0.16s; }
.bento-container .box:nth-child(4) { animation-delay: 0.22s; }
.bento-container .box:nth-child(5) { animation-delay: 0.28s; }
.bento-container .box:nth-child(6) { animation-delay: 0.34s; }
.bento-container .box:nth-child(7) { animation-delay: 0.4s; }
.bento-container .box:nth-child(8) { animation-delay: 0.46s; }

@keyframes hienLenMuot {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.full-span {
  grid-column: span 2;
}

.header-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

.profile-left {
  display: flex;
  align-items: center;
  gap: 18px;
}

.avatar {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  font-weight: bold;
  color: #fff;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--accent);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
  cursor: pointer;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.avatar-fallback {
  display: none;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
}

.name-area h1 {
  font-size: 23px;
  margin-bottom: 6px;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.28);
}

body.light-mode .name-area h1 {
  text-shadow: none;
}

/* Dòng trạng thái + chữ tự chạy */
.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-sub);
  font-size: 14px;
  min-height: 20px;
}

.dot-online {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: #22c55e;
  box-shadow: 0 0 10px #22c55e;
  flex-shrink: 0;
  animation: nhapNhay 1.6s infinite;
}

@keyframes nhapNhay {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

.sub-meta {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-sub);
}

.typing-cursor {
  display: inline-block;
  color: var(--accent);
  font-weight: bold;
  animation: conTro 0.8s infinite;
}

@keyframes conTro {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.header-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.lang-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.mini-btn {
  background-color: var(--tag-bg);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
}

.mini-btn:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.mini-btn.active {
  background-color: var(--accent);
  color: #06101e;
  border-color: var(--accent);
}

body.light-mode .mini-btn.active {
  color: #fff;
}

.theme-btn {
  background-color: var(--tag-bg);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.theme-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
  transform: translateY(-1px);
}

.box-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent);
  margin-bottom: 12px;
  font-weight: 700;
}

.info-list {
  list-style: none;
  line-height: 1.85;
  font-size: 15px;
}

.mini-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat-item {
  background-color: var(--tag-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 11px 12px;
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.stat-item:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-sub);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag {
  background-color: var(--tag-bg);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border-color);
  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.tag:hover {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
  transform: translateY(-2px);
}

/* Khu vực thiên hà xoáy + công thức Toán/Lý + code: không viền hộp, hòa vào nền */
.galaxy-zone {
  grid-column: span 2;
  position: relative;
  height: 250px;
  overflow: hidden;
  -webkit-mask-image: radial-gradient(ellipse 86% 78% at 50% 50%, #000 58%, transparent 100%);
  mask-image: radial-gradient(ellipse 86% 78% at 50% 50%, #000 58%, transparent 100%);
}

#galaxy-canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: transparent;
  cursor: grab;
}

#galaxy-canvas:active {
  cursor: grabbing;
}

.night-note {
  font-size: 15px;
  line-height: 1.75;
  color: var(--text-main);
}

/* Bảng giới thiệu địa danh Bạc Liêu */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border-color);
}

.place-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: left;
}

.place-table th {
  background-color: var(--table-head);
  color: var(--text-main);
  font-weight: 700;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.place-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-color);
  line-height: 1.55;
  vertical-align: top;
}

.place-table tr:last-child td {
  border-bottom: none;
}

.place-table tbody tr:hover {
  background-color: var(--table-row-hover);
}

/* Ô liên hệ dưới cùng */
.contact-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.action-btn {
  background-color: var(--accent);
  color: #06101e;
  text-decoration: none;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
  transition: transform 0.2s ease, filter 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

body.light-mode .action-btn {
  color: #fff;
}

.action-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.55);
}

.action-btn.copied {
  background-color: #22c55e;
  color: #06180d;
  box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
}

.action-btn.secondary {
  background-color: var(--tag-bg);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  box-shadow: none;
}

.action-btn.secondary:hover {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
}

/* Khung phóng to ảnh (Lightbox) */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(5, 8, 16, 0.85);
  backdrop-filter: blur(8px);
}

.lightbox.open {
  display: flex;
}

.lightbox-card {
  position: relative;
  max-width: 720px;
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
}

.lightbox-card img {
  max-width: 100%;
  max-height: 75vh;
  border-radius: 10px;
  object-fit: contain;
}
